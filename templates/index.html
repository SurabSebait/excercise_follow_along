<!DOCTYPE html>
<html>
<head>
    <title>Fitness AR Coach</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #111; }
        #ui { position: absolute; top: 20px; left: 20px; z-index: 100; color: white; pointer-events: none; }
        .data-card { background: rgba(0, 0, 0, 0.65); padding: 20px 28px; border-radius: 12px; border: 1px solid #00ff88; backdrop-filter: blur(6px); min-width: 220px; }
        .data-card h2 { margin: 0 0 8px 0; font-size: 16px; letter-spacing: 2px; text-transform: uppercase; color: #00ff88; }
        .rep-display { font-size: 56px; font-weight: 900; margin: 4px 0; line-height: 1; }
        .angle-display { font-size: 13px; color: #aaa; margin-top: 6px; }
        #feedback { margin-top: 10px; font-size: 15px; font-weight: 600; color: #00ff88; letter-spacing: 1px; }
        .controls { position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%); z-index: 100; display: flex; gap: 12px; }
        .controls button { padding: 12px 24px; cursor: pointer; border-radius: 8px; border: 2px solid transparent; background: rgba(0, 100, 255, 0.75); color: white; font-weight: 700; font-size: 14px; letter-spacing: 1px; text-transform: uppercase; transition: all 0.2s; backdrop-filter: blur(4px); }
        .controls button:hover, .controls button.active { background: rgba(0, 200, 120, 0.85); border-color: #00ff88; }
        #loading-overlay { position: absolute; top: 20px; right: 20px; z-index: 200; color: #aaa; font-size: 12px; background: rgba(0,0,0,0.5); padding: 6px 12px; border-radius: 6px; }
    </style>
</head>
<body>

<div id="ui">
    <div class="data-card">
        <h2 id="exName">Bicep Curl</h2>
        <div class="rep-display">REPS: <span id="repCount">0</span></div>
        <div class="angle-display">Angle: <span id="angleVal">—</span>°</div>
        <p id="feedback">Get Ready!</p>
    </div>
</div>

<div id="loading-overlay">Loading models…</div>

<div class="controls">
    <button id="btn-bicep_curl" class="active" onclick="setEx('bicep_curl')">Curls</button>
    <button id="btn-squat" onclick="setEx('squat')">Squats</button>
    <button id="btn-pushup" onclick="setEx('pushup')">Push-Ups</button>
</div>

<img id="processedFeed" src="" style="display:none;">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

<script>
    const socket = io();
    const feedImg = document.getElementById('processedFeed');

    // --- Three.js Setup ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Dynamic background texture from the Python stream
    const texture = new THREE.Texture(feedImg);
    scene.background = texture;

    // --- Socket Listeners ---
    socket.on('video_frame', (data) => {
        feedImg.src = 'data:image/jpeg;base64,' + data.image;
        texture.needsUpdate = true; // Refresh the AR background with pose lines
    });

    socket.on('data_update', (data) => {
        document.getElementById('repCount').textContent = data.reps;
        document.getElementById('angleVal').textContent = data.angle;
        
        const feedbackEl = document.getElementById('feedback');
        feedbackEl.textContent = data.stage === 'down' ? '⬆ PUSH / PULL UP' : '⬇ LOWER DOWN';
        feedbackEl.style.color = data.stage === 'down' ? '#ffdd00' : '#00ff88';

        // Sync 3D Character Bone (Example for Bicep Curl)
        const model = models[data.exercise];
        if (model) {
            const angleRad = (data.angle * Math.PI) / 180;
            const bone = model.getObjectByName('mixamorigLeftForeArm');
            if (bone) bone.rotation.z = angleRad;
        }
    });

    // --- Model Loading & Controls ---
    const loader = new THREE.GLTFLoader();
    const models = {};
    const exerciseNames = ['bicep_curl', 'squat', 'pushup'];

    exerciseNames.forEach(name => {
        loader.load(`/static/models/${name}.glb`, (gltf) => {
            const model = gltf.scene;
            model.scale.set(1.5, 1.5, 1.5);
            model.position.set(1.5, -1.5, -4);
            model.visible = (name === 'bicep_curl');
            scene.add(model);
            models[name] = model;
            if (Object.keys(models).length === 3) document.getElementById('loading-overlay').style.display = 'none';
        });
    });

    function setEx(name) {
        socket.emit('set_exercise', { name });
        exerciseNames.forEach(n => {
            document.getElementById('btn-' + n).classList.toggle('active', n === name);
            if (models[n]) models[n].visible = (n === name);
        });
        document.getElementById('exName').textContent = name.replace('_', ' ');
    }

    function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
