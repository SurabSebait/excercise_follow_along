<!DOCTYPE html>
<html>
<head>
    <title>Fitness AR Coach</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #111; }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            color: white;
            pointer-events: none;
        }

        .data-card {
            background: rgba(0, 0, 0, 0.65);
            padding: 20px 28px;
            border-radius: 12px;
            border: 1px solid #00ff88;
            backdrop-filter: blur(6px);
            min-width: 220px;
        }

        .data-card h2 {
            margin: 0 0 8px 0;
            font-size: 16px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #00ff88;
        }

        .rep-display {
            font-size: 56px;
            font-weight: 900;
            margin: 4px 0;
            line-height: 1;
        }

        .angle-display {
            font-size: 13px;
            color: #aaa;
            margin-top: 6px;
        }

        #feedback {
            margin-top: 10px;
            font-size: 15px;
            font-weight: 600;
            color: #00ff88;
            letter-spacing: 1px;
        }

        .controls {
            position: absolute;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            gap: 12px;
        }

        .controls button {
            padding: 12px 24px;
            cursor: pointer;
            border-radius: 8px;
            border: 2px solid transparent;
            background: rgba(0, 100, 255, 0.75);
            color: white;
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: background 0.2s, border-color 0.2s;
            backdrop-filter: blur(4px);
        }

        .controls button:hover,
        .controls button.active {
            background: rgba(0, 200, 120, 0.85);
            border-color: #00ff88;
        }

        #loading-overlay {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 200;
            color: #aaa;
            font-size: 12px;
            background: rgba(0,0,0,0.5);
            padding: 6px 12px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

<div id="ui">
    <div class="data-card">
        <h2 id="exName">Bicep Curl</h2>
        <div class="rep-display">REPS: <span id="repCount">0</span></div>
        <div class="angle-display">Angle: <span id="angleVal">—</span>°</div>
        <p id="feedback">Get Ready!</p>
    </div>
</div>

<div id="loading-overlay" id="modelStatus">Loading models…</div>

<div class="controls">
    <button id="btn-bicep_curl" class="active" onclick="setEx('bicep_curl')">Curls</button>
    <button id="btn-squat" onclick="setEx('squat')">Squats</button>
    <button id="btn-pushup" onclick="setEx('pushup')">Push-Ups</button>
</div>

<!-- Hidden video used as AR background texture -->
<video id="videoBG" src="/static/pushup.mp4" loop muted playsinline style="display:none;"></video>

<!-- Three.js r128 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<!-- GLTFLoader compatible with r128 from unpkg -->
<script src="https://unpkg.com/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<!-- Socket.IO -->
<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

<script>
    // ─── Socket.IO ────────────────────────────────────────────────────────────
    const socket = io();

    // ─── Video background ─────────────────────────────────────────────────────
    const video = document.getElementById('videoBG');
    video.play().catch(e => console.warn('Video autoplay blocked:', e));

    // ─── Three.js Scene Setup ─────────────────────────────────────────────────
    const scene    = new THREE.Scene();
    const camera   = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 5);   // Pull camera back so models are visible

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    // ─── Video Background Texture ─────────────────────────────────────────────
    const videoTexture = new THREE.VideoTexture(video);
    scene.background = videoTexture;

    // ─── Lighting ─────────────────────────────────────────────────────────────
    scene.add(new THREE.AmbientLight(0xffffff, 0.9));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
    dirLight.position.set(2, 4, 3);
    scene.add(dirLight);

    // ─── Load 3D Models ───────────────────────────────────────────────────────
    const loader = new THREE.GLTFLoader();
    const models = {};        // keyed by exercise name
    const mixers = {};        // AnimationMixers if models have animations
    const exerciseNames = ['bicep_curl', 'squat', 'pushup'];
    let loadedCount = 0;

    const loadingEl = document.getElementById('loading-overlay');

    exerciseNames.forEach(name => {
        loader.load(
            `/static/models/${name}.glb`,
            (gltf) => {
                const model = gltf.scene;
                model.scale.set(1.5, 1.5, 1.5);
                model.position.set(1.5, -1.5, -4);

                // Only show the default exercise on load
                model.visible = (name === 'bicep_curl');

                scene.add(model);
                models[name] = model;

                // Set up animation mixer if the model has animations
                if (gltf.animations && gltf.animations.length > 0) {
                    const mixer = new THREE.AnimationMixer(model);
                    mixers[name] = mixer;
                    // Optionally play the first clip:
                    // mixer.clipAction(gltf.animations[0]).play();
                }

                loadedCount++;
                if (loadedCount === exerciseNames.length) {
                    loadingEl.style.display = 'none';
                }
            },
            undefined,
            (err) => {
                console.warn(`Model "${name}.glb" failed to load:`, err);
                loadedCount++;
                if (loadedCount === exerciseNames.length) {
                    loadingEl.textContent = 'Some models missing';
                    setTimeout(() => { loadingEl.style.display = 'none'; }, 3000);
                }
            }
        );
    });

    // ─── Exercise Selection ───────────────────────────────────────────────────
    function setEx(name) {
        socket.emit('set_exercise', { name });

        // Update button styles
        exerciseNames.forEach(n => {
            const btn = document.getElementById('btn-' + n);
            if (btn) btn.classList.toggle('active', n === name);
        });

        // Update display name
        const labels = { bicep_curl: 'Bicep Curl', squat: 'Squat', pushup: 'Push-Up' };
        document.getElementById('exName').textContent = labels[name] || name;

        // Show/hide models
        exerciseNames.forEach(n => {
            if (models[n]) models[n].visible = (n === name);
        });
    }

    // ─── Socket Data Updates ──────────────────────────────────────────────────
    socket.on('data_update', (data) => {
        document.getElementById('repCount').textContent = data.reps;
        document.getElementById('angleVal').textContent = data.angle;

        const feedbackEl = document.getElementById('feedback');
        if (data.stage === 'down') {
            feedbackEl.textContent = '⬆ PUSH / PULL UP';
            feedbackEl.style.color = '#ffdd00';
        } else if (data.stage === 'up') {
            feedbackEl.textContent = '⬇ LOWER DOWN';
            feedbackEl.style.color = '#00ff88';
        } else {
            feedbackEl.textContent = 'Get Ready!';
            feedbackEl.style.color = '#aaa';
        }

        // Sync bone rotation to joint angle (angle already in degrees, convert to radians)
        const model = models[data.exercise];
        if (model) {
            const angleRad = (data.angle * Math.PI) / 180;

            // Try common Mixamo bone names — adjust to match your actual .glb rig
            const boneNames = [
                'mixamorigLeftForeArm',
                'mixamorigLeftForearm',
                'LeftForeArm',
                'left_forearm'
            ];
            for (const boneName of boneNames) {
                const bone = model.getObjectByName(boneName);
                if (bone) {
                    bone.rotation.z = angleRad;
                    break;
                }
            }
        }
    });

    // Handle server-side exercise change confirmation
    socket.on('exercise_changed', (data) => {
        const labels = { bicep_curl: 'Bicep Curl', squat: 'Squat', pushup: 'Push-Up' };
        document.getElementById('exName').textContent = labels[data.exercise] || data.display_name;
        document.getElementById('repCount').textContent = '0';
        document.getElementById('angleVal').textContent = '—';
    });

    // ─── Resize Handler ───────────────────────────────────────────────────────
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ─── Animation Loop ───────────────────────────────────────────────────────
    const clock = new THREE.Clock();

    function animate() {
        requestAnimationFrame(animate);

        const delta = clock.getDelta();

        // Update animation mixers
        for (const key in mixers) {
            mixers[key].update(delta);
        }

        renderer.render(scene, camera);
    }

    animate();
</script>
</body>
</html>
